name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # check-manifest:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - run: pipx run check-manifest

  test:
    name: ${{ matrix.platform }} (${{ matrix.python-version }})
    runs-on: ${{ matrix.platform }}
    env:
      # uv run should not re-sync; deps are installed in the Install step
      UV_NO_SYNC: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        platform: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # downloading data, required for CHOTA metric test
      - name: Retrieve cached data
        uses: actions/cache/restore@v6
        id: cache_data
        with:
          path: downloads
          key: ${{ hashFiles('scripts/download_test_data.py') }}

      - name: Download Samples
        if: steps.cache_data.outputs.cache-hit != 'true'
        run: |
          uv run --no-project --with requests python scripts/download_test_data.py

      - name: Cache sample data
        uses: actions/cache/save@v6
        if: steps.cache_data.outputs.cache-hit != 'true'
        with:
          path: downloads
          key: ${{ hashFiles('scripts/download_test_data.py') }}

      - name: Install dependencies
        run: uv sync --extra test

      - name: Test
        run: uv run pytest --color=yes --cov --cov-report=xml --cov-report=term-missing

      - name: Coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Run mypy
        run: uv run --extra typing mypy src --ignore-missing-imports

  examples:
    name: Examples
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Retrieve cached data
        uses: actions/cache/restore@v6
        id: cache_data
        with:
          path: downloads
          key: ${{ hashFiles('scripts/download_test_data.py') }}

      - name: Download Samples
        if: steps.cache_data.outputs.cache-hit != 'true'
        run: |
          uv run --no-project --with requests python scripts/download_test_data.py

      - name: Cache sample data
        uses: actions/cache/save@v6
        if: steps.cache_data.outputs.cache-hit != 'true'
        with:
          path: downloads
          key: ${{ hashFiles('scripts/download_test_data.py') }}

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Run notebooks
        # This will exit after the first error and will not report errors in subsequent nbs 
        run: uv run --with nbclient --with ipykernel jupyter execute examples/*.ipynb


  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      # don't re-resolve/sync when switching commits
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50 # this is to make sure we obtain the target base commit

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.13
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Retrieve cached data
        uses: actions/cache/restore@v6
        id: cache_data
        with:
          path: downloads
          key: ${{ hashFiles('scripts/download_test_data.py') }}

      - name: Download Samples
        if: steps.cache_data.outputs.cache-hit != 'true'
        run: |
          uv run --no-project --with requests python scripts/download_test_data.py

      - name: Cache sample data
        uses: actions/cache/save@v6
        if: steps.cache_data.outputs.cache-hit != 'true'
        with:
          path: downloads
          key: ${{ hashFiles('scripts/download_test_data.py') }}

      - name: Install dependencies
        run: uv sync --extra test

      - name: Retrieve cached baseline if available
        uses: actions/cache/restore@v6
        id: cache_baseline
        with:
          path: baseline.json
          key: ${{ github.event.pull_request.base.sha }}

      - name: Run baseline benchmark if not in cache
        if: steps.cache_baseline.outputs.cache-hit != 'true'
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          uv run pytest tests/bench.py -v --benchmark-json baseline.json

      - name: Cache baseline results
        uses: actions/cache/save@v6
        if: steps.cache_baseline.outputs.cache-hit != 'true'
        with:
          path: baseline.json
          key: ${{ github.event.pull_request.base.sha }}

      - name: Run benchmark on PR head commit
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
          uv run pytest tests/bench.py -v --benchmark-json pr.json

      - name: Generate report
        run: uv run python .github/workflows/benchmark-pr.py baseline.json pr.json report.md

      - name: Comment on commit with report for non-forks
        uses: peter-evans/commit-comment@v3
        if: github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]'
        with:
          body-path: report.md

  test-case-coverage:
    name: Test case coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      # uv run should not re-sync; deps are installed in the Install step
      UV_NO_SYNC: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: pyproject.toml


      - name: Install dependencies
        run: uv sync --extra covreport

      - name: Store target commit hash
        id: hash
        run: echo "commit=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - name: Run coverage report
        run: |
          uv run python scripts/test_case_report.py ${{ github.event.pull_request.head.sha }}

      - name: Add, stash, switch branch
        if: github.actor != 'dependabot[bot]'
        run: |
          git add ${{ github.event.pull_request.head.sha }}.png
          git stash
          git fetch
          git checkout test-case-coverage-report
          git stash pop

      - name: Commit to branch
        if: github.actor != 'dependabot[bot]'
        uses: EndBug/add-and-commit@v11
        with:
          add: "*.png"

      - name: Comment with image link
        if: github.actor != 'dependabot[bot]'
        uses: peter-evans/commit-comment@v3
        with:
          body: |
            ![coverage plot](https://github.com/live-image-tracking-tools/traccuracy/blob/test-case-coverage-report/${{ steps.hash.outputs.commit }}.png?raw=True)


  deploy:
    name: Deploy
    needs: test
    if: success() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build
        run: |
          git tag
          uv build
          uvx twine check dist/*
          ls -lh dist

      - name: Build and publish
        run: uvx twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE_API_KEY }}

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
